    async _ingest(file) {

        return;
      }

      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;

      // not just the decode — otherwise the old photo sits there with no
      // feedback while the canvas re-encode runs. An empty slot keeps its
      // placeholder (no spinner) until the encode lands, as before.
      // _swapGen guards the mask against re-renders DURING the encode
      // (pointerenter, ResizeObserver, another slot's store write): the
      // stored value still resolves to the old image there, so _render's
      // same-src clear would otherwise unmask it mid-replace.

        this.setAttribute('data-swapping', '');
        this._swapGen = gen;
      }

        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;

        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);

        // pending encode, so a byte-identical re-upload (same data URL, no
        // load event coming) still clears the mask via the complete branch.
        this._swapGen = 0;

        // shows, even though it cannot persist.

      } catch (err) {
        if (gen !== this._gen) return;
        this._swapGen = 0;

        // remote pick's src swap) is still in flight, in which case the
        // mask stays until THAT image settles (its load/error releases).
        this._releaseMask();

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;

      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is available on any filled slot — the user can
    // always reposition/scale. `fit` only sets the initial baseline (see
    // _geom): contain starts fully-visible, cover starts frame-filling.
    _reframes() {
      return this.hasAttribute('data-filled');
    }

    // The single release discipline for the replacement-in-flight mask
    // (data-swapping). The mask comes off only when BOTH hold:
    //  - no encode is pending (_swapGen) — mid-encode the stored value
    //    still resolves to the old image, so any reveal paints it;
    //  - the frame img has settled on its current src — an unsettled src
    //    means some replacement is still in flight (e.g. a remote pick),
    //    whoever started it, and revealing would paint the previous
    //    frame. The load/error listeners pass settled=true (the event IS
    //    the settlement signal, per spec complete is true by then);
    //    other callers rely on the complete flag (covers loaded AND
    //    failed).
    // Every release path funnels through here EXCEPT _render's empty
    // branch (the img is being cleared — nothing will ever settle).
    _releaseMask(settled) {
      if (
        !this._swapGen &&
        !this._loadPending &&
        (settled || this._img.complete)
      ) {
        this.removeAttribute('data-swapping');
      }
    }

    // Baseline geometry, shared by clamp/apply/resize. `base` is the scale at
    // view-scale s=1: cover = fill the frame (overflow on the looser axis),
    // contain = fit fully inside (letterboxed). Zooming a contain image past
    // s where it overflows naturally becomes a crop. Null until the img has
    // loaded (naturalWidth is 0 before that) or when the slot has no layout
    // box — ResizeObserver fires with a 0×0 rect under display:none, and
    // clamping against a degenerate 1×1 frame would silently pull the stored
    // pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      const contain = (this.getAttribute('fit') || 'cover').toLowerCase() === 'contain';
      const base = contain
        ? Math.min(fw / iw, fh / ih)
        : Math.max(fw / iw, fh / ih);
      return { iw, ih, fw, fh, base };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      // Top-layer controls: pin to the frame's top-right in viewport px
      // (the same 8px inset as the in-frame layout; unscaled — top-layer UI
      // reads as chrome, not page content). BEFORE the geometry branch:
      // placement needs only the frame rect, and a not-yet-loaded or broken
      // src must not leave the promoted strip floating unpositioned. Gated
      // on the popover actually being open: without the Popover API,
      // showPopover() threw (swallowed in _enterReframe), .ctl stays in
      // its in-frame absolute layout, and viewport-px coordinates would
      // shove it off-frame — and matches(':popover-open') itself throws
      // there (unknown pseudo-class), hence the try/catch.
      if (this.hasAttribute('data-reframe')) {
        let onTop = false;
        try { onTop = this._ctl.matches(':popover-open'); } catch {}
        if (onTop) {
          const r = this.getBoundingClientRect();
          this._ctl.style.left = (r.right - 8) + 'px';
          this._ctl.style.top = (r.top + 8) + 'px';
        }
      }
      if (!g) {
        // Dimensions not known yet (before img load) — centered fit so there
        // is no flash of an unpositioned image before the geometry lands.
        const contain = (this.getAttribute('fit') || 'cover').toLowerCase() === 'contain';
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = contain ? 'contain' : 'cover';
        return;
      }
      // Baseline (cover-fill or contain-fit) × view scale. Width/height and
      // left/top are all frame-% — depends only on the frame aspect ratio, so
      // a responsive resize keeps the same crop. The spill layer mirrors the
      // same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      if (this.hasAttribute('data-reframe')) {
        // Top-layer spill: position in viewport px over the frame. The top
        // layer escapes ancestor transforms entirely, so EVERY term must be
        // in viewport units: getBoundingClientRect gives the frame's scaled
        // origin AND size, and the rect/layout ratio rescales the ghost —
        // sizing from layout px alone renders it 1/scale too large under a
        // scaled deck slide. Inner ghost + handles stay box-relative.
        const r = this.getBoundingClientRect();
        const sx = g.fw ? r.width / g.fw : 1;
        const sy = g.fh ? r.height / g.fh : 1;
        this._spill.style.width = (g.iw * k * sx) + 'px';
        this._spill.style.height = (g.ih * k * sy) + 'px';
        this._spill.style.left = (r.left + (50 + this._view.x) / 100 * r.width) + 'px';
        this._spill.style.top = (r.top + (50 + this._view.y) / 100 * r.height) + 'px';

    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;

      // crop; clearing the sidecar still falls through to src=.

      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');

      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {

      // (Claude wrote it into the HTML) so it passes through unchanged.

      if (!this.hasAttribute('data-reframe')) {

      // An Unsplash src with no credit attribute must NOT render — showing
      // the photo uncredited is the Unsplash-terms violation itself. The
      // error tile replaces the photo until the credit is written. A
      // user-dropped image is the user's own content and always renders.
      // Trimmed: credit is agent/user-editable content, and a whitespace-
      // only value must count as missing — otherwise it would suppress the
      // error tile AND render an empty credit box (no text, no links),
      // exactly the unattributed state this gate exists to prevent.

        !credit && !this._userUrl && srcAttr && isUnsplashHost(srcAttr)

          // stylesheet rules). First fill (prev empty) keeps the existing
          // placeholder-until-load behavior — no spinner. _hidShowing

          // is gone, but an image WAS showing, so this is a replacement.

          // flag, not complete, to know a load is in flight.

          this._img.src = url;
          this._ghost.src = url;
        } else {

          // spinner can't stick after a byte-identical re-upload (same
          // data URL, no further load event ever fires).
          this._releaseMask();

        this._hidShowing = false;
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this.removeAttribute('data-swapping');
        // The src is being removed — no load/error will ever fire for it.
        this._loadPending = false;
        // A transient attribution-error wipe of a showing image happens on
        // the pick path: the host sets src one setAttribute before credit,
        // so render N hides the old image (attrError) and render N+1
        // restores a URL. Remember the wipe so that restore renders as a
        // replacement (spinner), not a first fill (blank frame).
        this._hidShowing = attrError && !!this._img.getAttribute('src');
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        // The error tile owns the blocked-photo state; .empty stays for
        // the genuinely-empty slot.
        this._empty.style.display = attrError ? 'none' : 'flex';
        this.removeAttribute('data-filled');

      // textContent + the http(s)-only funnel keep external strings inert.
      const showCredit = !!(url && credit && !this._userUrl && !attrError);
      this._credit.textContent = '';
      if (showCredit) {

        // then append the terms-required utm referral params to links
        // that point back at unsplash.com.
        let href = '';
        const rawHref = this.getAttribute('credit-href') || '';
        if (rawHref) {
          try {
            const u = new URL(rawHref, document.baseURI);
            if (u.protocol === 'http:' || u.protocol === 'https:') {
              href = withReferral(u.href);

          const a = document.createElement('a');
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
          a.setAttribute('href', linkHref);
          a.textContent = text;
          return a;

        // name to their profile (credit-href) and 'Unsplash' to the
        // homepage. Render that split whenever the text has the canonical
        // shape; other text keeps the legacy single-link rendering.
        const m = /^Photo by (.+) on Unsplash$/.exec(credit);
        if (m) {
          this._credit.appendChild(document.createTextNode('Photo by '));
          this._credit.appendChild(
            href ? mkLink(m[1], href) : document.createTextNode(m[1])
          );
          this._credit.appendChild(document.createTextNode(' on '));
          this._credit.appendChild(mkLink('Unsplash', UNSPLASH_HOMEPAGE_HREF));

          this._credit.appendChild(mkLink(credit, href));
        } else {
          this._credit.textContent = credit;

    customElements.define('image-slot', ImageSlot);

  const LABELS = { tdah: 'TDAH', dislexia: 'Dislexia', autismo: 'Autismo', 'altas-habilidades': 'Altas habilidades', neurodivergencia: 'Neurodivergência', estudar: 'Estudar', trabalhar: 'Trabalhar', rotina: 'Rotina', projetos: 'Projetos', processos: 'Processos', artigo: 'Artigo', guia: 'Guia', tutorial: 'Tutorial', video: 'Vídeo', noticia: 'Notícia', framework: 'Framework', evidencia: 'Evidência', curadoria: 'Curadoria', ia: 'IA', agentes: 'Agentes', skills: 'Skills', prompts: 'Prompts', workflows: 'Workflows', apps: 'Apps', gratuito: 'Gratuito', pago: 'Pago', 'ia-agentes': 'IA e agentes', photoprompts: 'Photoprompts', templates: 'Templates', assets: 'Assets', ebooks: 'E-books', digitais: 'Digitais', fisicos: 'Físicos', livros: 'Livros', cursos: 'Cursos', afiliados: 'Afiliados', discussoes: 'Discussões', perguntas: 'Perguntas', compartilhamentos: 'Compartilhamentos', sugestoes: 'Sugestões' };

  // Detail route each catalog links to; demo slugs exemplo-1…exemplo-12 resolve, anything else → 404.
  const DETAIL = { blog: '/blog/', riscos: '/riscos-cognitivos/', apps: '/apps/', ferramentas: '/ferramentas/', loja: '/loja/', mapas: '/mapas/', mapa: '/mapas/', cases: '/studio/projetos/', comunidade: '/comunidade/topicos/', busca: '/blog/' };
  const DEMO_SLUG = /^exemplo-([1-9]|1[0-2])$/;

  const pagePaths = R.filter(r => r.type === 'pagina').reduce((m, r) => (m[r.url] = r, m), {});
  const dynamics = R.filter(r => r.type === 'dinamica').map(r => ({ r, re: new RegExp('^' + r.url.replace('[slug]', '([^/]+)') + '$') }));

  function parse(url) {
    const [beforeHash, anchor = ''] = url.split('#');
    const [path, qs = ''] = beforeHash.split('?');
    return { path: path || '/', query: Object.fromEntries(new URLSearchParams(qs)), anchor, qs };
  }

    const entry = R.find(r => r.url === url) || null;
    let page = pagePaths[p.path], slug = null;
    if (!page) {
      for (const d of dynamics) { const m = p.path.match(d.re); if (m) { page = d.r; slug = m[1]; break; } }
      if (page && !DEMO_SLUG.test(slug)) return { ...p, url, entry: null, page: null, slug, pattern: 'notfound' };
    }
    if (!page) return { ...p, url, entry, page: null, pattern: 'notfound' };
    const bp = BP[page.id];
    return { ...p, url, entry: entry || page, page, bp, slug, query: cleanQuery(page, p.query), pattern: PATTERN[page.template] || 'artigo' };
  }
  function withQuery(path, query) {
    const qs = new URLSearchParams(Object.entries(query).filter(([, v]) => v != null && v !== '')).toString();
    return path + (qs ? '?' + qs : '');
  }

  window.ECO = { R, BP, byId, SITES, MAIN, GROUPS, BASE, FOOTER, PATTERN, PATTERN_LABEL, FACETS, COMMUNITY_TIPO, LABELS, DETAIL, resolve, parse, withQuery, label: v => LABELS[v] || v };
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  // data-om-starter: inert presence marker — Claude Design's starter-usage
  // probe reads it. The closed panel renders nothing, so the marker rides
  // the <html> element as an attribute instead of a rendered node — zero
  // elements added, so page CSS (even structural selectors like
  // :nth-child) can never observe it. It records that the page WIRES a
  // tweaks panel, whether or not the panel is open. Keep this effect.
  React.useEffect(() => {
    document.documentElement.setAttribute('data-om-starter', 'tweaks-panel');
    return () => document.documentElement.removeAttribute('data-om-starter');
  }, []);

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;

function __twkIsLight(hex) {

// fields: [{ name, label, type, required, rows }]; demo mode is explicit — nothing is sent.
function FormSection({ id, formId, fields, submitLabel, title, consent = true }) {
  const [vals, setVals] = React.useState({});
  const [errs, setErrs] = React.useState({});
  const [state, setState] = React.useState('idle');
  const submit = e => {
    e.preventDefault();
    const er = {};
    fields.forEach(f => {
      const v = (vals[f.name] || '').trim();
      if (f.required && !v) er[f.name] = 'Campo obrigatório.';
      else if (f.type === 'email' && v && !/.+@.+\..+/.test(v)) er[f.name] = 'E-mail inválido.';
    });
    if (consent && !vals.__ok) er.__ok = 'Confirme o consentimento.';
    setErrs(er);
    if (Object.keys(er).length) return;
    setState('sending'); setTimeout(() => setState('done'), 800);
  };
  if (state === 'done') return <div className="eco-col eco-pad-sm"><div className="eco-form done"><i className="ph ph-check-circle"></i><h2>Recebido (demonstração).</h2><p className="muted">Endpoint de “{formId}” a configurar no CMS — nenhum dado foi enviado.</p><Button variant="secondary" onClick={() => { setVals({}); setState('idle'); }}>Novo envio</Button></div></div>;
  return (
    <div className="eco-col eco-pad-sm">
      <form className="eco-form" onSubmit={submit} noValidate aria-label={title || formId}>
        {title && <h2>{title}</h2>}
        {fields.map(f => (
          <div key={f.name}>
            {f.rows
              ? <div className="field"><label htmlFor={formId + f.name}>{f.label}{f.required ? ' *' : ''}</label><textarea id={formId + f.name} className="input" rows={f.rows} value={vals[f.name] || ''} onChange={e => setVals({ ...vals, [f.name]: e.target.value })}></textarea></div>
              : <TextField label={f.label + (f.required ? ' *' : '')} type={f.type || 'text'} value={vals[f.name] || ''} onChange={e => setVals({ ...vals, [f.name]: e.target.value })} />}
            {errs[f.name] && <p className="eco-err" role="alert">{errs[f.name]}</p>}
          </div>
        ))}
        {consent && <label className="eco-check"><input type="checkbox" checked={!!vals.__ok} onChange={e => setVals({ ...vals, __ok: e.target.checked })} />Lorem ipsum dolor sit amet — consentimento para tratamento dos dados.</label>}
        {errs.__ok && <p className="eco-err" role="alert">{errs.__ok}</p>}
        <div className="eco-form-foot"><Button type="submit" disabled={state === 'sending'}>{state === 'sending' ? 'Enviando…' : submitLabel}</Button><span className="muted">Modo demonstração</span></div>
      </form>
    </div>
  );
}

          </ul>
        ) : (
          <div className="eco-map-canvas" role="group" aria-label="Mapa interativo">

            </svg>

            ))}

        <aside className="eco-map-detail" aria-live="polite">

    if (page.id === 'briefing') return { ...p, fields: [{ name: 'nome', label: 'Nome', required: true }, { name: 'email', label: 'E-mail', type: 'email', required: true }, { name: 'empresa', label: 'Empresa ou projeto' }, { name: 'briefing', label: 'Briefing', rows: 6, required: true }], submitLabel: 'Enviar briefing' };
  }
  if (page.id === 'contato' && type === 'DirectoryLinks') return { title: 'Redes sociais', groups: [{ title: 'Perfis oficiais', links: [['Instagram', null], ['LinkedIn', null], ['YouTube', null]] }] };
  return p;
}

function BlockError({ b, msg }) {
  return <div className="eco-wrap"><div className="eco-block-error" role="alert"><b>{b.type}#{b.id}</b> — {msg}</div></div>;
}

function BlockRenderer({ blocks }) {
  return blocks.map((b, k) => {
    const C = REGISTRY[b.type];
    let body;
    if (C === undefined) body = <BlockError b={b} msg="tipo desconhecido no registry" />;
    else if (b.version !== 1) body = <BlockError b={b} msg={'versão ' + b.version + ' não suportada'} />;
    else {
      const miss = (REQUIRED[b.type] || []).filter(r => b.props[r] == null);
      body = miss.length ? <BlockError b={b} msg={'props obrigatórias ausentes: ' + miss.join(', ')} /> : <C id={b.id} first={k === 0} {...b.props} />;
    }
    return (
      <section key={b.id} id={b.id} data-block={b.type} className={'eco-block' + (b.surface ? ' s-' + b.surface : '')}>
        <span className="eco-block-label">{b.type}#{b.id}</span>
        {body}
      </section>
    );
  });
}

function RoutePage() {
  const { res, site } = useEco();
  const blocks = React.useMemo(() => res.page ? recipe(res, site) : [], [res, site]);
  if (res.pattern === 'notfound') return (
    <section className="eco-block"><div className="eco-wrap eco-gate"><p className="eco-kicker">404</p><h1 className="eco-showroom-title">Página não encontrada.</h1><p className="eco-lead">Rota ou slug inexistente/não publicado: <code>{res.path}</code></p><Actions actions={[{ label: 'Ir para o início', href: '/' }, { label: 'Busca', href: '/busca' }]} /></div></section>
  );
  return <BlockRenderer blocks={blocks} />;
}

Object.assign(window, { REGISTRY, REQUIRED, recipe, BlockRenderer, RoutePage, demoItems });
</script><script type="text/babel" data-file="EcoApp.jsx">const ECO_TWEAKS = /*EDITMODE-BEGIN*/{
  "site": "executar",
  "viewport": "desktop",
  "inspector": true,
  "buildTags": true,
  "blockLabels": false
}/*EDITMODE-END*/;

const readHash = () => { const h = decodeURIComponent(location.hash.slice(1)); return h.startsWith('/') ? h : null; };

function EcoApp() {
  const [t, setTweak] = useTweaks(ECO_TWEAKS);
  const [url, setUrl] = React.useState(() => readHash() || localStorage.getItem('eco-url') || '/');
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [mapOpen, setMapOpen] = React.useState(false);
  const [narrow, setNarrow] = React.useState(false);
  const scrollRef = React.useRef(null);
  const frameRef = React.useRef(null);
  const btnRef = React.useRef(null);
  const site = ECO.SITES[t.site] || ECO.SITES.executar;
  const res = React.useMemo(() => ECO.resolve(url), [url]);

  const scrollTo = React.useCallback(id => {
    const sc = scrollRef.current; if (!sc) return false;
    const el = sc.querySelector('#' + CSS.escape(id));
    if (!el) return false;
    sc.scrollTo({ top: el.offsetTop - 64, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return true;
  }, []);
  const go = React.useCallback(to => {
    if (!to) return;
    setMenuOpen(false);
    if (to !== readHash()) history.pushState(null, '', '#' + to);
    setUrl(to);
    localStorage.setItem('eco-url', to);
  }, []);

  React.useEffect(() => {
    const onPop = () => { const h = readHash() || '/'; setUrl(h); localStorage.setItem('eco-url', h); };
    window.addEventListener('popstate', onPop);
    if (!readHash()) history.replaceState(null, '', '#' + url);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  React.useEffect(() => {
    const sc = scrollRef.current; if (!sc) return;
    if (res.anchor) requestAnimationFrame(() => requestAnimationFrame(() => scrollTo(res.anchor)));
    else { sc.style.scrollBehavior = 'auto'; sc.scrollTop = 0; sc.style.scrollBehavior = ''; }
  }, [url]);
  React.useEffect(() => {
    const k = e => { if (e.key === 'Escape') { if (menuOpen) { setMenuOpen(false); btnRef.current && btnRef.current.focus(); } setMapOpen(false); } };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [menuOpen]);
  React.useEffect(() => { if (scrollRef.current) scrollRef.current.style.overflowY = menuOpen ? 'hidden' : ''; }, [menuOpen]);
  React.useEffect(() => {
    const el = frameRef.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => setNarrow(e.contentRect.width < 768));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  React.useEffect(() => { document.title = (res.page ? res.page.title + ' · ' : '') + site.name; }, [res, site]);

  const ctx = { site, res, go, scrollTo, narrow, showTags: t.buildTags };
  return (
    <EcoCtx.Provider value={ctx}>
      <div className={'eco-stage' + (t.viewport === 'mobile' ? ' is-mobile' : '')}>
        <div ref={frameRef} className={'eco eco-frame' + (t.blockLabels ? ' eco-show-labels' : '') + (narrow ? ' is-narrow' : '')} data-theme="light" data-screen-label={res.url}>
          <a className="eco-skip" href="#conteudo" onClick={e => { e.preventDefault(); const m = scrollRef.current.querySelector('main'); m && m.focus(); }}>Pular para o conteúdo</a>
          <div className="eco-scroll" ref={scrollRef}>
            <GlobalHeader menuOpen={menuOpen} setMenuOpen={v => { setMenuOpen(v); if (!v && btnRef.current) btnRef.current.focus(); }} btnRef={btnRef} />
            <main id="conteudo" tabIndex={-1} key={site.key + res.url.split('#')[0]} data-pattern={res.pattern}><RoutePage /></main>
            <GlobalFooter />
          </div>
          {menuOpen && <EcosystemMenu close={() => setMenuOpen(false)} />}
          {t.inspector && <Inspector openMap={() => setMapOpen(true)} />}
          {mapOpen && <Sitemap close={() => setMapOpen(false)} />}
        </div>
      </div>
      <TweaksPanel>
        <TweakSection label="Ecossistema" />
        <TweakRadio label="Site" value={t.site} options={[{ value: 'executar', label: 'EXECUTAR' }, { value: 'risco', label: 'Risco Cognitivo' }]} onChange={v => setTweak('site', v)} />
        <TweakRadio label="Viewport" value={t.viewport} options={[{ value: 'desktop', label: 'Desktop' }, { value: 'mobile', label: 'Celular' }]} onChange={v => setTweak('viewport', v)} />
        <TweakSection label="Revisão" />
        <TweakToggle label="Tag “Em construção”" value={t.buildTags} onChange={v => setTweak('buildTags', v)} />
        <TweakToggle label="Mostrar blocos (tipo#id)" value={t.blockLabels} onChange={v => setTweak('blockLabels', v)} />
        <TweakToggle label="Inspetor de rota" value={t.inspector} onChange={v => setTweak('inspector', v)} />
        <TweakButton label="Abrir mapa de rotas" onClick={() => setMapOpen(true)} />
      </TweaksPanel>
    </EcoCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<EcoApp />);
</script>
</body></html>
